name: Run SportArb Scanner

on:
  schedule:
    # Runs at 08:00 UTC (11:00 AM EAT) on Mondays and Wednesdays
    - cron: '0 8 * * 1,3'
  workflow_dispatch: # This allows you to also trigger the scan manually from GitHub!

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute Scanner
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: python auto_scanner.py
