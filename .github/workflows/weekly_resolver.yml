name: Weekly CLV Self-Learning

on:
  schedule:
    # Run every Monday at 06:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  run-learning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas tabulate

      - name: Run CLV Analyzer
        run: |
          python clv_analyzer.py

      - name: Commit and push CLV data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clv_history.csv clv_report.md acca_tracker.json
          git commit -m "Automated update: Monday CLV Resolution & Report" || exit 0
          git push
