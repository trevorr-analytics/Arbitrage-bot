name: Daily Auto-Quant Accumulators

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 5,6,7'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_accas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Accumulator Builder & Send Telegram
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python accumulator_builder.py
          
      - name: Commit Tracker Updates
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add acca_tracker.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Tracker" && git push)
